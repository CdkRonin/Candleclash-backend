name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: SECRET_KEY=ci-dummy-secret-key-for-import-check MONGODB_URL=mongodb://localhost:27017/candleclash python -c "import main; print('import ok')"
